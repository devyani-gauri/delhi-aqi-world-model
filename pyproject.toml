[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "delhi-aqi-world-model"
version = "0.1.0"
description = "An experimental grid-based world model for Delhi air quality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyterlab>=4.4"]

[project.scripts]
delhi-aqi-sim = "src.server:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
